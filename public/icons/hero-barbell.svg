<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="barRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E31837" />
      <stop offset="100%" stop-color="#FF3B5C" />
    </linearGradient>
    <linearGradient id="barMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E0E0EC" />
      <stop offset="100%" stop-color="#808095" />
    </linearGradient>
    <filter id="barGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Main Barbell Shaft -->
  <line x1="5" y1="24" x2="43" y2="24" stroke="url(#barMetal)" stroke-width="3.5" stroke-linecap="round" />
  <!-- Center Knurling Grip -->
  <rect x="19" y="21.5" width="10" height="5" rx="1" fill="url(#barRed)" opacity="0.9" />
  <line x1="22" y1="21.5" x2="22" y2="26.5" stroke="#FFFFFF" stroke-width="1" opacity="0.7" />
  <line x1="26" y1="21.5" x2="26" y2="26.5" stroke="#FFFFFF" stroke-width="1" opacity="0.7" />
  
  <!-- Left Weight Plates -->
  <rect x="13" y="13" width="3.5" height="22" rx="1.5" fill="url(#barMetal)" stroke="url(#barRed)" stroke-width="1" />
  <rect x="9" y="10" width="4.5" height="28" rx="2" fill="url(#barRed)" filter="url(#barGlow)" />
  <rect x="6" y="15" width="3" height="18" rx="1" fill="url(#barMetal)" />
  
  <!-- Right Weight Plates -->
  <rect x="31.5" y="13" width="3.5" height="22" rx="1.5" fill="url(#barMetal)" stroke="url(#barRed)" stroke-width="1" />
  <rect x="34.5" y="10" width="4.5" height="28" rx="2" fill="url(#barRed)" filter="url(#barGlow)" />
  <rect x="39" y="15" width="3" height="18" rx="1" fill="url(#barMetal)" />
  
  <!-- Collars -->
  <circle cx="17.5" cy="24" r="2.5" fill="url(#barMetal)" />
  <circle cx="30.5" cy="24" r="2.5" fill="url(#barMetal)" />
</svg>
