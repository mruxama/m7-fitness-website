      <stop offset="0%" stop-color="#FF2A4B" />
      <stop offset="100%" stop-color="#E31837" />
    </linearGradient>
    <linearGradient id="silverGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
