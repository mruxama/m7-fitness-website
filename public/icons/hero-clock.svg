<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="clockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E31837" />
      <stop offset="100%" stop-color="#FF4D6D" />
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#A0A0B0" />
    </linearGradient>
    <filter id="glowClock" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Ring -->
  <circle cx="24" cy="24" r="21" stroke="url(#clockGrad)" stroke-width="2" stroke-dasharray="4 2" opacity="0.6" />
  <circle cx="24" cy="24" r="18" stroke="url(#silverGrad)" stroke-width="2.5" opacity="0.9" />
  <!-- Ticks -->
  <line x1="24" y1="8" x2="24" y2="11" stroke="url(#clockGrad)" stroke-width="2.5" stroke-linecap="round" />
  <line x1="40" y1="24" x2="37" y2="24" stroke="url(#silverGrad)" stroke-width="2" stroke-linecap="round" />
  <line x1="24" y1="40" x2="24" y2="37" stroke="url(#silverGrad)" stroke-width="2" stroke-linecap="round" />
  <line x1="8" y1="24" x2="11" y2="24" stroke="url(#clockGrad)" stroke-width="2.5" stroke-linecap="round" />
  <!-- Clock Hands pointing to 19:00 -->
  <path d="M24 24L16 16" stroke="url(#clockGrad)" stroke-width="3" stroke-linecap="round" filter="url(#glowClock)" />
  <path d="M24 24L24 13" stroke="url(#silverGrad)" stroke-width="3" stroke-linecap="round" />
  <!-- Center Cap -->
  <circle cx="24" cy="24" r="3.5" fill="#E31837" />
  <circle cx="24" cy="24" r="1.5" fill="#FFFFFF" />
</svg>
