      <stop offset="100%" stop-color="#FF4D6D" />
    </linearGradient>
    <linearGradient id="trainerSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
