<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="timeRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E31837" />
      <stop offset="100%" stop-color="#FF2A4B" />
    </linearGradient>
    <linearGradient id="timeSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#A8A8C0" />
    </linearGradient>
    <filter id="timeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Calendar Frame -->
  <rect x="7" y="10" width="34" height="31" rx="5" stroke="url(#timeSilver)" stroke-width="2.5" fill="rgba(18, 18, 22, 0.7)" />
  <path d="M7 17H41" stroke="url(#timeRed)" stroke-width="2" />
  
  <!-- Top Binder Rings -->
  <rect x="14" y="6" width="3" height="7" rx="1.5" fill="url(#timeSilver)" />
  <rect x="31" y="6" width="3" height="7" rx="1.5" fill="url(#timeSilver)" />
  
  <!-- Male & Female Combined Symbol Frame inside -->
  <!-- Male arrow -->
  <path d="M16 29L22 23M22 23H17M22 23V28" stroke="url(#timeRed)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Female cross -->
  <path d="M30 33V38M27.5 35.5H32.5" stroke="url(#timeSilver)" stroke-width="2.2" stroke-linecap="round" />
  
  <!-- Central Interlocking Ring -->
  <circle cx="21" cy="30" r="5" stroke="url(#timeRed)" stroke-width="2" />
  <circle cx="27" cy="30" r="5" stroke="url(#timeSilver)" stroke-width="2" filter="url(#timeGlow)" />
</svg>
